[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25.10"
zip = "8.6.0"
pdfium-render = "0.9.3"
dirs = "6.0.0"
thiserror = "2.0.20"
base64 = "0.23.1"
enigo = "0.6.1"
open = "5.3.0"
xcap = "0.3"
# 008008: PDF 生成用 crate（画像を A4 ページに配置して結合）
# printpdf 0.7.0 は内部で image 0.24.x を使用するため、別名でインポート
printpdf = { version = "0.7", features = ["embedded_images"] }
# printpdf の内部互換性のため image 0.24.x を別名で使用
image_crate = { package = "image", version = "0.24", default-features = false, features = ["png", "jpeg"] }
tauri-plugin-dialog = "2"
# 003006: backend API 連携用 HTTP クライアント（tauri-plugin-http の reqwest re-export を使用）
# NPM パッケージ @tauri-apps/plugin-http (v2.6.0) と Rust crate のバージョンを一致させる
tauri-plugin-http = { version = "2.6.0", features = ["multipart", "json"] }
# 003006: 一時 ZIP 出力先の一意なフォルダ名生成用
uuid = { version = "1", features = ["v4"] }
