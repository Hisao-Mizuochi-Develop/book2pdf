# book2pdf Web OCR/PDF システム用 Docker Compose 構成です
# backend（FastAPI）、ocr-worker（ndlocr_cli）、frontend（Next.js）を別コンテナとして分離します
#
# 使い方:
#   docker compose up -d --build
# 上記コマンドで backend / ocr-worker / frontend の 3 サービスが起動します。
# 初回ビルド時は npm install に時間がかかるため、frontend の起動まで 1 〜 2 分ほど待ってください。

services:
  # FastAPI バックエンドコンテナです
  # ZIP アップロード、ジョブ管理、PDF 生成、ダウンロード API を提供します
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: book2pdf-backend
    ports:
      # ホストの 8000 番ポートをコンテナの 8000 番ポートにマッピングします
      - "8000:8000"
    volumes:
      # 共有データディレクトリをマウントします
      # 現状はメモリ内管理ですが、将来の永続化・共有ストレージ対応に向けて準備しています
      - uploads:/data/uploads
      - extracted:/data/extracted
      - ocr_output:/data/ocr_output
      - pdfs:/data/pdfs
      # 進捗通知用ファイルの共有ディレクトリです
      # backend と ocr-worker が進捗 JSON をやり取りするために使用します
      - progress:/data/progress
      # ソースコードをホストと共有し、ホットリロードを有効にします
      - ./backend:/app
      # ocr-worker の progress_reporter をテストでインポートできるようにマウントします
      - ./ocr-worker/ndlocr_cli_patches:/opt/ndlocr_cli_patches:ro
    environment:
      # 本番環境では実際の秘密鍵を設定してください
      - SECRET_KEY=change-me-in-production
      # ocr-worker コンテナの OCR API エンドポイントを設定します
      - OCR_WORKER_URL=http://ocr-worker:8001
      # OCR 処理は数分〜数十分かかるため、backend から ocr-worker へのリクエストタイムアウトを長めに設定します
      - OCR_WORKER_REQUEST_TIMEOUT=3600
      # 性能測定時に DEBUG ログを出力できるようにログレベルを設定します
      - LOG_LEVEL=DEBUG
      # ocr-worker の progress_reporter をテストでインポートできるように PYTHONPATH を設定します
      # /opt 配下に ndlocr_cli_patches パッケージがマウントされているため、親ディレクトリを指定します
      - PYTHONPATH=/opt
    depends_on:
      # ocr-worker コンテナの起動を待ちます
      # ただし、起動を待つだけで OCR 処理の完了は待ちません
      - ocr-worker

  # OCR ワーカーコンテナです
  # ndlocr_cli を Python パッケージとして import して OCR 処理を実行します
  ocr-worker:
    build:
      context: ./ocr-worker
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: book2pdf-ocr-worker
    ports:
      # backend コンテナから ocr-worker の HTTP API にアクセスできるようにします
      - "8001:8001"
    volumes:
      # backend と同じ共有データディレクトリをマウントします
      - uploads:/data/uploads
      - extracted:/data/extracted
      - ocr_output:/data/ocr_output
      - pdfs:/data/pdfs
      # 進捗通知用ファイルの共有ディレクトリです
      - progress:/data/progress
      # ソースコードをホストと共有し、ホットリロードを有効にします
      # Dockerfile の WORKDIR /opt/ocr-worker と一致させ、app/ ディレクトリのみマウントします
      # cli/ などの依存モジュールはイメージ内のものを使用するため、上書きしないよう注意してください
      - ./ocr-worker/app:/opt/ocr-worker/app
    environment:
      # 性能測定時に DEBUG ログを出力できるようにログレベルを設定します
      - LOG_LEVEL=DEBUG
      # OW003006: 入力画像前処理（sharpen_light_upscale_2x）の ON/OFF 制御です
      # false に設定すると、前処理なしで OCR を実行します
      # OW003007: 追加前処理効果検証のため、スクリプト側で前処理を行う前提で一時的に OFF にする
      - PREPROCESS_ENABLED=false
    # Dockerfile の CMD で FastAPI サーバーを起動します

  # フロントエンドコンテナです
  # Next.js 開発サーバーを起動し、ブラウザから操作できるようにします
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    platform: linux/amd64
    container_name: book2pdf-frontend
    ports:
      # ホストの 3000 番ポートをコンテナの 3000 番ポートにマッピングします
      - "3000:3000"
    volumes:
      # ソースコードをホストと共有し、ホットリロードを有効にします
      - ./frontend:/app
      # node_modules はコンテナ内のものを使用し、ホストのもので上書きしないようにします
      - /app/node_modules
    environment:
      # ブラウザから backend API へアクセスするためのホスト側 URL です
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      # backend コンテナの起動を待ちます
      - backend
    healthcheck:
      # Next.js 開発サーバーの起動を確認します
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

# 共有ボリュームの定義です
# コンテナ間でデータを共有し、プロセス再起動後もデータを保持します
volumes:
  uploads:
  extracted:
  ocr_output:
  pdfs:
  progress:
