name: Markdown Table Validator

on:
  pull_request:
    paths:
      - "**.md"
  push:
    branches: [main]
    paths:
      - "**.md"

jobs:
  lint-markdown-tables:
    runs-on: ubuntu-latest
    name: Validate Markdown pipe-table alignment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run markdown table validator
        run: python scripts/lint-task-md.py
